name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm run verify
        env:
          ASTRODECK_KIT_CHECKS: '1'

  starter:
    name: Clean starter verifies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          install: false
      - name: Copy checkout to temp dir (no .git, no node_modules)
        run: |
          mkdir -p "$RUNNER_TEMP/starter"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/starter"
      - name: Install
        working-directory: ${{ runner.temp }}/starter
        run: pnpm install --frozen-lockfile
      - name: Clean to starter
        working-directory: ${{ runner.temp }}/starter
        run: pnpm run starter:clean --yes
      - name: Customize like a user (brand color)
        working-directory: ${{ runner.temp }}/starter
        run: pnpm run theme --primary "#2f7d5b"
      - name: Verify starter
        working-directory: ${{ runner.temp }}/starter
        run: pnpm run verify --starter
      - name: Install Chromium
        working-directory: ${{ runner.temp }}/starter
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser checks (menu, theme toggle, skip link)
        working-directory: ${{ runner.temp }}/starter
        run: pnpm run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: starter-playwright-traces
          path: ${{ runner.temp }}/starter/test-results/
          if-no-files-found: ignore
